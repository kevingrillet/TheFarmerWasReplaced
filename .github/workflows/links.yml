name: Links

on:
  push:
    paths:
      - '**/*.md'
      - '.github/workflows/links.yml'
      - '.lycheeignore'
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/links.yml'
      - '.lycheeignore'
  schedule:
    - cron:  '0 0 * * SUN'

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --verbose --no-progress '*.md' '.github/*.md' docs/README.md
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
